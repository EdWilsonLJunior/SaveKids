# SwiftLint Configuration
# Standard: Kodeco / Google Swift Style Guide / Airbnb (industry best practices)
# Last updated: 2026-04-25

included:
  - ZodiakiOS
  - ZodiakiOSTests
  - ZodiakiOSUITests

excluded:
  - ZodiakiOS/Resources
  - ZodiakiOS/Assets.xcassets

# MARK: - Disabled Rules

disabled_rules:
  # Project has no standardized file header
  - file_header
  # Native SwiftUI/ViewBuilder idiom uses () omission in trailing closures
  - empty_parentheses_with_trailing_closure

# MARK: - Opt-in Rules

opt_in_rules:
  # SRP / One chained call per line (primary rule for this project)
  - multiline_function_chains

  # Collection best practices
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_count
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - joined_default_parameter
  - last_where
  - reduce_into

  # Code quality
  - closure_spacing
  - explicit_init
  - identical_operands
  - legacy_multiple
  - operator_usage_whitespace
  - optional_enum_case_matching
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

  # Visual structure
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

  # SwiftUI + MVVM
  - modifier_order
  - overridden_super_call
  - private_action
  - private_outlet
  - weak_delegate

  # Fase 1 — Segurança
  - force_unwrapping
  - implicitly_unwrapped_optional
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - return_value_from_void_function

  # Fase 2 — Arquitetura & Swift moderno
  - extension_access_modifier
  - shorthand_optional_binding
  - prefer_self_in_static_references
  # Nota: explicit_acl removido (app target, não framework — adds noise sem valor real)
  # Nota: file_name removido (múltiplos tipos por arquivo é padrão do projeto)

  # Fase 3 — Documentação DocC
  - missing_docs

  # Fase 4 — Qualidade de testes e imports
  - async_without_await

# MARK: - Analyzer Rules (requerem: swiftlint analyze)
analyzer_rules:
  - unused_import

# MARK: - Rule Configuration

line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: false

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 40
  error: 100

type_body_length:
  warning: 250
  error: 400

cyclomatic_complexity:
  warning: 10
  error: 20

function_parameter_count:
  warning: 5
  error: 7

large_tuple:
  warning: 3

nesting:
  type_level:
    warning: 1
    error: 2
  function_level:
    warning: 2
    error: 4

identifier_name:
  min_length:
    warning: 1
    error: 0
  max_length:
    warning: 40
    error: 60
  excluded:
    - id
    - _
    - x
    - y
    - i
    - j

# Fase 3 — Documentação DocC
# Configurado para open+public: 0 violations no app target (todos internos por padrão).
# DocC adicionado manualmente a Services, Models e ViewModels para qualidade da equipe.
missing_docs:
  warning:
    - open
    - public

# Fase 4 — Qualidade de testes (activar após split do arquivo monolítico de testes)
