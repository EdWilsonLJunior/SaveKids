[versions]
agp                        = "8.13.2"
kotlin                     = "2.1.20"
ksp                        = "2.1.20-1.0.32"
coreKtx                    = "1.16.0"
lifecycleRuntimeKtx        = "2.9.0"
activityCompose            = "1.10.1"
composeBom                 = "2025.05.00"
hilt                       = "2.55"
hiltNavigationCompose      = "1.2.0"
navigationCompose          = "2.9.0"
datastore                  = "1.1.3"
coroutines                 = "1.10.1"
turbine                    = "1.2.0"
junit-platform-launcher    = "1.11.4"
junit5                     = "5.11.4"
junitVintage               = "5.11.4"
androidJunit5              = "1.11.2.0"
mockk                      = "1.13.14"
paparazzi                  = "1.3.5"
detekt                     = "1.23.7"
material3Adaptive          = "1.1.0"
adaptiveNavSuite           = "1.4.0"
windowSize                 = "1.3.0"
immutableCollections       = "0.3.8"
coil                       = "3.1.0"
accompanistPermissions     = "0.37.0"
room                       = "2.7.2"
retrofit                   = "2.11.0"
okhttp                     = "4.12.0"

[libraries]
# Build Logic (classpath-only — not published to modules)
agp-plugin                  = { group = "com.android.tools.build", name = "gradle",                  version.ref = "agp" }
kotlin-gradlePlugin         = { group = "org.jetbrains.kotlin",   name = "kotlin-gradle-plugin",    version.ref = "kotlin" }
kotlin-compose-gradlePlugin = { group = "org.jetbrains.kotlin",   name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin            = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin           = { group = "com.google.dagger",        name = "hilt-android-gradle-plugin",          version.ref = "hilt" }

# AndroidX Core
androidx-core-ktx           = { group = "androidx.core",            name = "core-ktx",               version.ref = "coreKtx" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",  version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel= { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose   = { group = "androidx.activity",        name = "activity-compose",        version.ref = "activityCompose" }

# Compose BOM
compose-bom                 = { group = "androidx.compose",         name = "compose-bom",             version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",      name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui",      name = "ui-graphics" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",      name = "ui-tooling-preview" }
compose-ui-tooling          = { group = "androidx.compose.ui",      name = "ui-tooling" }
compose-ui-test-manifest    = { group = "androidx.compose.ui",      name = "ui-test-manifest" }
compose-ui-test-junit4      = { group = "androidx.compose.ui",      name = "ui-test-junit4" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-material3-adaptive  = { group = "androidx.compose.material3.adaptive", name = "adaptive",           version.ref = "material3Adaptive" }
compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout", version.ref = "material3Adaptive" }
compose-material3-adaptive-nav = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "material3Adaptive" }
compose-material3-nav-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "adaptiveNavSuite" }
compose-runtime-livedata    = { group = "androidx.compose.runtime", name = "runtime-livedata" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
navigation-compose          = { group = "androidx.navigation",      name = "navigation-compose",      version.ref = "navigationCompose" }

# Hilt
hilt-android                = { group = "com.google.dagger",        name = "hilt-android",            version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",        name = "hilt-compiler",           version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",            name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# DataStore
datastore-preferences       = { group = "androidx.datastore",       name = "datastore-preferences",   version.ref = "datastore" }

# Room
room-runtime                = { group = "androidx.room",            name = "room-runtime",            version.ref = "room" }
room-ktx                    = { group = "androidx.room",            name = "room-ktx",                version.ref = "room" }
room-compiler               = { group = "androidx.room",            name = "room-compiler",           version.ref = "room" }

# Retrofit + OkHttp
retrofit-core               = { group = "com.squareup.retrofit2",   name = "retrofit",                version.ref = "retrofit" }
retrofit-converter-gson     = { group = "com.squareup.retrofit2",   name = "converter-gson",          version.ref = "retrofit" }
okhttp-logging              = { group = "com.squareup.okhttp3",     name = "logging-interceptor",     version.ref = "okhttp" }

# Coroutines
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-test",  version.ref = "coroutines" }

# Kotlin Serialization (para Navigation type-safe routes)
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx",   name = "kotlinx-serialization-json", version = "1.8.0" }

# Immutable Collections
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "immutableCollections" }

# Coil (image loading)
coil-compose                = { group = "io.coil-kt.coil3",        name = "coil-compose",            version.ref = "coil" }
coil-network-okhttp         = { group = "io.coil-kt.coil3",        name = "coil-network-okhttp",     version.ref = "coil" }

# Window Size
androidx-window             = { group = "androidx.window",          name = "window",                  version.ref = "windowSize" }

# Testing
junit5-api                  = { group = "org.junit.jupiter",  name = "junit-jupiter-api",          version.ref = "junit5" }
junit5-engine               = { group = "org.junit.jupiter",  name = "junit-jupiter-engine",       version.ref = "junit5" }
junit5-params               = { group = "org.junit.jupiter",  name = "junit-jupiter-params",       version.ref = "junit5" }
junit5-launcher             = { group = "org.junit.platform", name = "junit-platform-launcher",    version = "1.11.4" }
mockk                       = { group = "io.mockk",                 name = "mockk",                   version.ref = "mockk" }
turbine                     = { group = "app.cash.turbine",         name = "turbine",                  version.ref = "turbine" }
paparazzi                   = { group = "app.cash.paparazzi",       name = "paparazzi",               version.ref = "paparazzi" }

[plugins]
android-application         = { id = "com.android.application",          version.ref = "agp" }
android-library             = { id = "com.android.library",              version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",     version.ref = "kotlin" }
kotlin-jvm                  = { id = "org.jetbrains.kotlin.jvm",         version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                        = { id = "com.google.dagger.hilt.android",   version.ref = "hilt" }
ksp                         = { id = "com.google.devtools.ksp",          version.ref = "ksp" }
zodiak-android-application  = { id = "zodiak.android.application",       version = "unspecified" }
zodiak-android-library      = { id = "zodiak.android.library",           version = "unspecified" }
zodiak-android-compose      = { id = "zodiak.android.compose",           version = "unspecified" }
zodiak-android-feature      = { id = "zodiak.android.feature",           version = "unspecified" }
zodiak-android-hilt         = { id = "zodiak.android.hilt",              version = "unspecified" }
zodiak-android-test         = { id = "zodiak.android.test",              version = "unspecified" }
paparazzi-plugin            = { id = "app.cash.paparazzi",               version.ref = "paparazzi" }
detekt                      = { id = "io.gitlab.arturbosch.detekt",        version.ref = "detekt" }
