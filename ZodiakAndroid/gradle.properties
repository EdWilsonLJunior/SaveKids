# ─── Gradle daemon ───────────────────────────────────────────────────────────
# Heap maior reduz GC durante kotlinc/KSP. Em Macs com 16GB+ use 6g; em 8GB caia para 3g.
org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: ganho enorme em builds incrementais (segundas execuções).
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# configureondemand é incompatível com configuration-cache e foi descontinuado.
org.gradle.configureondemand=false
#org.gradle.java.home=/opt/homebrew/opt/openjdk@21

# ─── Throttling (modo "não trava a máquina") ─────────────────────────────────
# Limite os workers paralelos do Gradle para liberar CPU para chamadas/IDE.
# Comente para usar todos os núcleos; descomente p/ não pesar (≈metade dos cores).
org.gradle.workers.max=4
org.gradle.priority=low

# ─── Android ─────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# ─── Kotlin ──────────────────────────────────────────────────────────────────
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
# Daemon Kotlin separado: evita brigar com o daemon do Gradle pela heap.
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m

# ─── KSP ─────────────────────────────────────────────────────────────────────
# KSP2 é significativamente mais rápido que o KSP1 legado.
ksp.useKSP2=true

# Desligar geração padrão de BuildConfig/resValues em libs (nenhum módulo usa BuildConfig).
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.aidl=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
