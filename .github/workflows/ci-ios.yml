name: CI iOS

env:
  SWIFTLINT_VERSION: "0.57.0"

on:
  pull_request:
    branches: [main]
    paths:
      - 'ZodiakiOS/**'
  push:
    branches: [main]
    paths:
      - 'ZodiakiOS/**'

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZodiakiOS
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftLint binary
        id: cache-swiftlint
        uses: actions/cache@v4
        with:
          path: ~/.swiftlint
          key: swiftlint-linux-${{ env.SWIFTLINT_VERSION }}

      - name: Install SwiftLint
        if: steps.cache-swiftlint.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.swiftlint
          curl -fsSL "https://github.com/realm/SwiftLint/releases/download/${{ env.SWIFTLINT_VERSION }}/swiftlint_linux.zip" \
            -o /tmp/swiftlint.zip
          unzip -q /tmp/swiftlint.zip swiftlint -d ~/.swiftlint/

      - name: Add SwiftLint to PATH
        run: echo "$HOME/.swiftlint" >> $GITHUB_PATH

      - name: Run SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

  audit:
    name: Token & Localization Audits
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ZodiakiOS
    steps:
      - uses: actions/checkout@v4
      - name: Dark mode audit (no hardcoded colors)
        run: python3 scripts/audit_dark_mode.py --strict
