name: CI Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'ZodiakAndroid/**'
  push:
    branches: [main]
    paths:
      - 'ZodiakAndroid/**'

jobs:
  lint:
    name: Detekt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZodiakAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run Detekt
        run: ./gradlew detekt

  build:
    name: Build Debug
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ZodiakAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ZodiakAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests
        run: ./gradlew test
