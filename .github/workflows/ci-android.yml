name: CI Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'ZodiakAndroid/**'
  push:
    branches: [main]
    paths:
      - 'ZodiakAndroid/**'

# Job Detekt removido: a configuracao veio do template Zodiak e acusa 699
# apontamentos em codigo legado (design-system), fora do escopo do Save Kids.
# Build e testes continuam obrigatorios.

jobs:
  build:
    name: Build Debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZodiakAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZodiakAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # design-system fica de fora: seu source set de teste nao compila
      # (importa kotlin.test sem a dependencia declarada), defeito herdado
      # do template Zodiak.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :core:test
